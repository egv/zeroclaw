[skill]
name = "gog-email"
description = "Gmail operations using gog CLI tool via SSH to bezalel"
version = "1.0.0"
author = "ZeroClaw"
tags = ["email", "gmail", "communication"]

[[tools]]
name = "email_check"
description = "Search and list emails from Gmail. Provide a Gmail search query as arguments (e.g., 'is:unread', 'from:boss@company.com', 'subject:meeting'). Returns JSON array with id, date, from, subject, labels."
kind = "shell"
command = "ssh bezalel 'GOG_KEYRING_PASSWORD=my-secret-password gog gmail messages search \"${query:-is:inbox}\" -j --results-only --max=20'"

[[tools]]
name = "email_unread"
description = "Quickly list unread emails from inbox. Returns JSON array of unread messages with id, date, from, subject."
kind = "shell"
command = "ssh bezalel 'GOG_KEYRING_PASSWORD=my-secret-password gog gmail messages search is:unread -j --results-only --max=20'"

[[tools]]
name = "email_get"
description = "Get full email content by message ID. Use this to read the complete email body after getting the ID from email_check or email_unread. Parameter: message_id."
kind = "shell"
command = "ssh bezalel 'GOG_KEYRING_PASSWORD=my-secret-password gog gmail get \"${message_id}\" -j --results-only --format=full'"

[[tools]]
name = "email_send"
description = "Send an email via Gmail. Required: to, subject, and body parameters."
kind = "shell"
command = "ssh bezalel 'GOG_KEYRING_PASSWORD=my-secret-password gog gmail send --to=\"${to}\" --subject=\"${subject}\" --body=\"${body}\"'"

[[tools]]
name = "email_mark_read"
description = "Mark a Gmail thread as read. Pass thread_id as first argument (can be obtained from email search results)."
kind = "shell"
command = "ssh bezalel 'GOG_KEYRING_PASSWORD=my-secret-password gog gmail thread modify \"${thread_id}\" --remove-label UNREAD -j --results-only'"

[[prompts]]
prompt = """
You have access to Gmail via the gog CLI tool on host bezalel. Use these email tools when:

- User asks about emails, messages, inbox, or mail
- User wants to check for new messages
- User asks to send an email  
- User references specific email subjects or senders

Available tools:
- email_unread: Quick check for unread emails
- email_check [query...]: Search emails with Gmail query syntax
- email_get [message_id]: Read full email content
- email_send [--to=EMAIL --subject='SUBJECT' --body='BODY']: Send an email
- email_mark_read [thread_id]: Mark thread as read

Gmail query syntax examples:
- is:unread - unread emails
- is:inbox - inbox emails  
- from:someone@example.com - from specific sender
- subject:meeting - subject contains word
- after:2026/02/01 - emails after date
- label:work - emails with label

Workflow for checking emails:
1. Use email_unread to check for new messages
2. If user wants specific emails, use email_check with query
3. Use email_get with message ID to read full content
4. Use email_mark_read with thread_id after user reviews

Workflow for sending emails:
1. Confirm recipient, subject, and body with user
2. Use email_send with confirmed details
3. Confirm successful delivery

Important:
- Account: g.evstratov@gmail.com
- Always confirm before sending emails
- Message IDs from search can be used with email_get
- Thread IDs can be used with email_mark_read
- Never send sensitive info without explicit approval
"""
