[skill]
name = "gog-email"
description = "Gmail operations using gog CLI tool"
version = "1.0.0"
author = "ZeroClaw"
tags = ["email", "gmail", "communication"]

[[tools]]
name = "email_unread"
description = "List unread emails from Gmail inbox"
kind = "shell"
command = "bash"
args = ["-c", "GOG_KEYRING_PASSWORD=my-secret-password gog gmail messages search is:unread -j --results-only --max=20"]

prompts = ["You have access to Gmail via the gog CLI tool. Available tools: email_unread (list unread emails). Account: g.evstratov@gmail.com"]
